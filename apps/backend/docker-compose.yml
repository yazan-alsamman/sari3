# Local infrastructure for Saree'e backend Phase 1 (ADR-001)
services:
  postgres:
    image: postgres:16-alpine
    container_name: sareee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sareee
      POSTGRES_PASSWORD: sareee
      POSTGRES_DB: sareee
    ports:
      - "5432:5432"
    volumes:
      - sareee_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sareee -d sareee"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sareee-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sareee
      MINIO_ROOT_PASSWORD: sareee-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sareee_minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: sareee-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sareee_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sareee_pg_data:
  sareee_redis_data:
  sareee_minio_data:
